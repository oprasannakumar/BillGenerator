<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Entry</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b6cff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #5b6cff;
    --primary-hover: #4757e6;
    --primary-light: #eef1ff;
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --danger: #ef4444;
    --danger-light: #fee2e2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }

  .app-container {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    position: relative;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  /* Top Right Quick Links */
  .quick-links-wrapper {
    position: relative;
  }

  .quick-links-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .quick-links-btn:hover {
    background: #e0e7ff;
  }

  .quick-links-menu {
    position: absolute;
    top: 46px;
    right: 0;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    display: none;
    min-width: 220px;
    z-index: 100;
    border: 1px solid var(--border-color);
  }

  .quick-links-menu a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-main);
    transition: background 0.15s;
  }

  .quick-links-menu a:hover {
    background: var(--bg-color);
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 18px;
  }

  .form-row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 14px;
    background: #fafbfc;
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    transition: all 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(91, 108, 255, 0.1);
  }

  /* Recipient Section Styling */
  .recipient-block {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    position: relative;
    transition: border-color 0.2s;
  }

  .recipient-block:hover {
    border-color: #cbd5e1;
  }

  .recipient-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .recipient-tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 4px 10px;
    border-radius: 6px;
  }

  .remove-recipient-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }

  .remove-recipient-btn:hover {
    background: var(--danger-light);
  }

  /* Item Styles */
  .item-block {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }

  .item-row {
    margin-bottom: 8px;
  }

  .qty-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .qty-row input {
    height: 40px;
    font-size: 13px;
  }

  /* Action Buttons */
  .add-recipient-btn {
    width: 100%;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px dashed var(--primary);
    border-radius: 10px;
    height: 44px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background 0.2s;
  }

  .add-recipient-btn:hover {
    background: #e0e7ff;
  }

  .add-item-btn {
    width: 100%;
    background: #ffffff;
    color: var(--primary);
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    height: 36px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }

  .add-item-btn:hover {
    background: #f0fdf4; /* gentle hover */
    background: var(--primary-light);
  }

  /* Total & Footer Bar */
  .summary-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--primary-light);
    padding: 16px 20px;
    border-radius: 12px;
    margin: 24px 0 16px 0;
  }

  .summary-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .summary-total {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
  }

  .save-btn {
    width: 100%;
    height: 48px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .save-btn:hover {
    background: var(--primary-hover);
  }

  .save-btn:active {
    transform: scale(0.99);
  }

  /* Print / Result Layout Customizations */
  .invoice-preview {
    max-width: 750px;
    margin: 40px auto;
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    font-family: 'Inter', sans-serif;
  }
</style>
</head>

<body>

<div class="app-container" id="mainCard">
  <div class="header-row">
    <h2>Invoice Entry</h2>
    <div class="quick-links-wrapper">
      <button class="quick-links-btn" onclick="toggleLinks()">☰</button>
      <div class="quick-links-menu" id="quickLinksMenu">
        <a href="https://oprasannakumar.github.io/MonthlytransactionsGoogleSheets/" target="_blank">
          📊 Monthly Transactions
        </a>
        <a href="https://oprasannakumar.github.io/LoanTransferGoogleSheets/" target="_blank">
          💳 Loan Entry
        </a>
      </div>
    </div>
  </div>

  <div class="form-row-grid">
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="billDate">
    </div>
    <div class="form-group">
      <label>Invoice Number</label>
      <input type="text" id="invoiceNumber" placeholder="Auto if empty">
    </div>
  </div>

  <div class="form-group">
    <label>Dealer</label>
    <input list="dealerList" id="dealerSelect" placeholder="Type dealer name">
    <datalist id="dealerList"></datalist>
  </div>

  <!-- Recipient Blocks Container -->
  <div id="recipientsContainer" style="margin-top: 20px;"></div>

  <button id="addRecipientBtn" class="add-recipient-btn" onclick="addRecipient()" style="display:none;">
    + Add Recipient Group
  </button>

  <div class="summary-box">
    <span class="summary-label">Grand Total</span>
    <span class="summary-total" id="liveTotal">₹0.00</span>
  </div>

  <button class="save-btn" onclick="saveInvoice()">Save & Generate Invoice</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGbUkkZBP480n_U_fsCNppCD6T06GT0Tbh4gI1PsBxGdmc-wpnKHzZi-kahxderWpv/exec";
const API_KEY = "9848o22338B!";

const RECIPIENT_OPTIONS = [
  "Select",
  "Self",
  "House",
  "Mother",
  "Grand Father",
  "Chinnama",
  "Family",
  "Pedhamma",
  "Vasavi",
  "Other"
];

let groceries = {};
let dealerItems = [];

/* ---------- INIT ---------- */
window.onload = () => {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  document.getElementById("billDate").value = `${yyyy}-${mm}-${dd}`;

  fetch(`${API_URL}?key=${API_KEY}`)
    .then(r => r.json())
    .then(data => {
      groceries = data || {};
      populateDealers();
    });
};

function updateTotal(){
  let total = 0;
  document.querySelectorAll(".item-block").forEach(w => {
    const inputs = w.querySelectorAll(".qty-row input");
    if(inputs[2]) {
      const val = Number(inputs[2].value || 0);
      total += val;
    }
  });
  document.getElementById("liveTotal").innerText = "₹" + total.toFixed(2);
}

/* ---------- SEARCHABLE DEALER ---------- */
function populateDealers(){
  const list = document.getElementById("dealerList");
  list.innerHTML = "";

  const set = new Set();
  Object.values(groceries).forEach(a =>
    a.forEach(d => set.add(d.dealer))
  );

  [...set].sort().forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    list.appendChild(opt);
  });

  document.getElementById("dealerSelect").addEventListener("change", onDealerChange);
}

function onDealerChange(){
  dealerItems = [];
  const dealer = document.getElementById("dealerSelect").value;
  const container = document.getElementById("recipientsContainer");
  const addRecBtn = document.getElementById("addRecipientBtn");

  container.innerHTML = "";

  if(!dealer) {
    addRecBtn.style.display = "none";
    updateTotal();
    return;
  }

  Object.keys(groceries).forEach(item => {
    groceries[item].forEach(d => {
      if(d.dealer === dealer){
        dealerItems.push({item, price: d.price});
      }
    });
  });

  addRecBtn.style.display = "block";
  addRecipient();
}

/* ---------- ADD RECIPIENT ---------- */
function addRecipient(){
  const container = document.getElementById("recipientsContainer");
  const recId = "rec_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

  const block = document.createElement("div");
  block.className = "recipient-block";
  block.id = recId;

  block.innerHTML = `
    <div class="recipient-top-bar">
      <span class="recipient-tag">Recipient Group</span>
      ${container.children.length > 0 ? `<button type="button" class="remove-recipient-btn" onclick="removeRecipient('${recId}')">Remove Group</button>` : ''}
    </div>
    
    <div class="form-group" style="margin-bottom:12px;">
      <select class="recipient-select" onchange="handleRecipientSelectChange(this)">
        ${RECIPIENT_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join("")}
      </select>
    </div>

    <div class="form-group recipient-other-group" style="display:none; margin-bottom:12px;">
      <input type="text" class="recipient-other-name" placeholder="Enter custom recipient name">
    </div>

    <div class="recipient-items-container"></div>

    <button type="button" class="add-item-btn" onclick="addItemToRecipient('${recId}')">+ Add Item</button>
  `;

  container.appendChild(block);
  addItemToRecipient(recId);
}

function removeRecipient(recId){
  const el = document.getElementById(recId);
  if(el){
    el.remove();
    updateTotal();
  }
}

function handleRecipientSelectChange(selectElem){
  const block = selectElem.closest(".recipient-block");
  const otherGroup = block.querySelector(".recipient-other-group");
  if(selectElem.value === "Other"){
    otherGroup.style.display = "block";
  } else {
    otherGroup.style.display = "none";
  }
}

/* ---------- ADD ITEM TO RECIPIENT ---------- */
function addItemToRecipient(recId){
  if(!dealerItems.length) return;

  const recBlock = document.getElementById(recId);
  const itemsContainer = recBlock.querySelector(".recipient-items-container");

  const wrapper = document.createElement("div");
  wrapper.className = "item-block";

  const itemRow = document.createElement("div");
  itemRow.className = "item-row";

  const listId = "itemList_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

  const sel = document.createElement("input");
  sel.setAttribute("list", listId);
  sel.placeholder = "Search or type item name...";

  const dataList = document.createElement("datalist");
  dataList.id = listId;
  dataList.innerHTML = dealerItems.map(i =>
    `<option value="${i.item}"></option>`
  ).join("");

  itemRow.append(sel);

  const qtyRow = document.createElement("div");
  qtyRow.className = "qty-row";

  const qty = document.createElement("input");
  qty.type = "number";
  qty.placeholder = "Qty";

  const price = document.createElement("input");
  price.type = "number";
  price.placeholder = "Price";

  const total = document.createElement("input");
  total.type = "number";
  total.placeholder = "Total";

  function recalc(source){
    const q = Number(qty.value || 0);
    const p = Number(price.value || 0);
    const t = Number(total.value || 0);

    if(q === 0) return;

    if(source === "price"){
      total.value = (q * p).toFixed(2);
    }
    if(source === "total"){
      price.value = (t / q).toFixed(2);
    }
    updateTotal();
  }

  qty.oninput = () => recalc("price");
  price.oninput = () => recalc("price");
  total.oninput = () => recalc("total");

  sel.onchange = () => {
    const match = dealerItems.find(i => i.item === sel.value);
    if(match){
      price.value = match.price;
      recalc("price");
    }
  };

  qtyRow.append(qty, price, total);

  const content = document.createElement("div");
  content.className = "item-content";
  content.append(itemRow, qtyRow);

  wrapper.append(content, dataList);
  itemsContainer.appendChild(wrapper);

  enableSwipe(wrapper, content);
}

function enableSwipe(wrapper, content){
  let startX = 0;
  let currentX = 0;
  let dragging = false;

  content.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    currentX = startX;
    dragging = true;
  });

  content.addEventListener("touchmove", (e) => {
    if(!dragging) return;
    currentX = e.touches[0].clientX;
    let diff = currentX - startX;
    if(diff < 0){
      content.style.transform = `translateX(${Math.max(diff, -100)}px)`;
    }
  });

  content.addEventListener("touchend", () => {
    dragging = false;
    if(currentX - startX < -80){
      wrapper.remove();
      updateTotal();
    } else {
      content.style.transform = "translateX(0)";
    }
  });
}

/* ---------- SAVE + RENDER ---------- */
function saveInvoice(){
  const dealer = document.getElementById("dealerSelect").value;
  if(!dealer){ alert("Please select a dealer"); return; }

  const billDateVal = document.getElementById("billDate").value;
  let billNo = document.getElementById("invoiceNumber").value.trim();

  if(!billNo){
    billNo = "INV-" + Date.now();
  }

  let items = [];
  let grandTotal = 0;
  let hasValidRecipient = true;

  document.querySelectorAll(".recipient-block").forEach(recBlock => {
    const sel = recBlock.querySelector(".recipient-select");
    let recipientName = sel.value;

    if(recipientName === "Select"){
      hasValidRecipient = false;
    } else if(recipientName === "Other"){
      const otherInput = recBlock.querySelector(".recipient-other-name");
      recipientName = otherInput.value.trim() || "Other";
    }

    recBlock.querySelectorAll(".item-block").forEach(w => {
      const itemInput = w.querySelector("input[list]");
      const item = itemInput ? itemInput.value.trim() : "";
      const inputs = w.querySelectorAll(".qty-row input");

      const qty = Number(inputs[0].value);
      const price = Number(inputs[1].value);
      const total = Number(inputs[2].value);

      if(!item || !qty) return;

      grandTotal += total;
      items.push({
        recipient: recipientName,
        item: item,
        qty: qty,
        price: price,
        total: total
      });
    });
  });

  if(!hasValidRecipient){
    alert("Please choose a valid recipient option for all groups.");
    return;
  }

  if(!items.length){ alert("Please add at least one item."); return; }

  renderInvoice(billNo, billDateVal, dealer, items, grandTotal);

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      key: API_KEY,
      action: "saveInvoice",
      shopName: dealer,
      billNo: billNo,
      billDate: billDateVal,
      items: items
    })
  });
}

/* ---------- RENDER INVOICE ---------- */
function renderInvoice(billNo, date, dealer, items, grandTotal){
  document.getElementById("mainCard").style.display = "none";

  const container = document.createElement("div");
  container.className = "invoice-preview";

  container.innerHTML = `
    <h2 style="margin-bottom: 16px;">Invoice Receipt</h2>

    <div style="margin-bottom:24px; font-size: 14px; color: var(--text-muted); line-height: 1.6;">
      <div>
        <strong>Invoice No:</strong>
        <span id="copyInvoice" style="
          background: var(--primary-light);
          padding: 4px 8px;
          border-radius: 6px;
          cursor: pointer;
          color: var(--primary);
          font-weight: 600;
        ">${billNo}</span>
        <span id="copyMsg" style="margin-left:8px; font-size:12px; color:green; display:none;">Copied ✓</span>
      </div>
      <div><strong>Date:</strong> ${formatDisplayDate(date)}</div>
      <div><strong>Dealer:</strong> ${dealer}</div>
    </div>

    <table style="width:100%; border-collapse:collapse; font-size: 14px;">
      <thead>
        <tr style="background:#f8fafc; border-bottom: 2px solid var(--border-color);">
          <th style="padding:12px; text-align:left; color: var(--text-muted);">Recipient</th>
          <th style="padding:12px; text-align:left; color: var(--text-muted);">Item</th>
          <th style="padding:12px; text-align:right; color: var(--text-muted);">Qty</th>
          <th style="padding:12px; text-align:right; color: var(--text-muted);">Price</th>
          <th style="padding:12px; text-align:right; color: var(--text-muted);">Total</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(i => `
          <tr>
            <td style="padding:12px; border-bottom:1px solid #eee; font-weight:500; color:var(--primary);">${i.recipient}</td>
            <td style="padding:12px; border-bottom:1px solid #eee;">${i.item}</td>
            <td style="padding:12px; text-align:right; border-bottom:1px solid #eee;">${i.qty}</td>
            <td style="padding:12px; text-align:right; border-bottom:1px solid #eee;">₹${i.price}</td>
            <td style="padding:12px; text-align:right; border-bottom:1px solid #eee;">₹${i.total}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <div style="text-align:right; font-size:20px; font-weight:700; margin-top:24px; color: var(--primary);">
      Grand Total: ₹${grandTotal.toFixed(2)}
    </div>

    <div style="margin-top:32px; display:flex; gap:12px;">
      <button onclick="window.print()" style="flex:1; height:46px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:600; cursor:pointer;">Print Invoice</button>
      <button onclick="location.reload()" style="flex:1; height:46px; border:none; border-radius:10px; background:#e2e8f0; color:var(--text-main); font-weight:600; cursor:pointer;">New Invoice</button>
    </div>
  `;

  document.body.appendChild(container);

  navigator.clipboard.writeText(billNo).then(() => {
    const msg = document.getElementById("copyMsg");
    if(msg){
      msg.style.display = "inline";
      setTimeout(() => msg.style.display = "none", 1500);
    }
  });

  document.getElementById("copyInvoice").onclick = function(){
    navigator.clipboard.writeText(billNo);
    const msg = document.getElementById("copyMsg");
    msg.style.display = "inline";
    setTimeout(() => msg.style.display = "none", 1500);
  };
}

function formatDisplayDate(dateStr){
  const d = new Date(dateStr);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + "-" + months[d.getMonth()] + "-" + d.getFullYear();
}

function toggleLinks(){
  const menu = document.getElementById("quickLinksMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

document.addEventListener("click", function(e){
  if(!e.target.closest(".quick-links-wrapper")){
    const menu = document.getElementById("quickLinksMenu");
    if(menu) menu.style.display = "none";
  }
});
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Invoice App Registered'))
        .catch(err => console.log('PWA Registration Failed', err));
    });
  }
</script>
</body>
</html>
